<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Crédito</title>

    <!-- Este es el enlace para el CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="form-container">
        <h1>Datos del Crédito</h1>
        <!-- Envia los datos por el GET -->
        <form action="html/resultado.html">
            <fieldset>
                <legend>Información General</legend>
                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" name="fecha" required>
            </fieldset>

            <fieldset>
                <legend>Detalles del Préstamo</legend>
                <p>Moneda:</p>
                <label>
                    <input type="radio" name="moneda" value="Soles" required>Soles:> Soles (S/.)
                </label>
                <label>
                    <input type="radio" name="moneda" value="Dolares"> Dólares (US%)
                </label>

                <br><br>

                <label for="monto">Monto:</label>
                <input type="number" id="monto" name="monto" required>

                <label for="cuota">Cuota:</label>
                <input type="number" step="0.01" id="cuota" name="cuota" required>
            </fieldset>

            <fieldset>
                <legend>Tasas y Vencimiento</legend>
                <label for="tea">Tea (%):</label>
                <input type="number" step="0.01" id="tea" name="tea">

                <label for="fecha_vencimiento">Fecha de Vencimiento:</label>
                <input type="date" id="fecha_vencimiento" name="fecha_vencimiento">
            </fieldset>

            <div class="button-group">
                <button type="submit">Aceptar</button>
            </div>
        </form>
    </div>
</body>
</html>
