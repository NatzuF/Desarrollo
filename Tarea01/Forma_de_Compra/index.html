<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Crédito</title>

    <!-- Este es el enlace para el CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="form-container">
        <h1>Financiera Huanca</h1>
        <!-- Envia los datos por el GET -->

        <div class="tabs">
            <button type="button" class="tab-btn" onclick="mostrarPestana(this, 'personales')">Datos personales</button>
            <button type="button" class="tab-btn active" onclick="mostrarPestana(this, 'credito')">Datos crédito</button>
        </div>

        <form action="html/resultado.html" method="GET">
            <div id="personales" class="tab-content">
                <fieldset>
                    <legend>Información del Cliente</legend>
                    <label for="nombres">Nombres completos:</label>
                    <input type="text" id="nombres" name="nombres">

                    <label for="documento">CURP:</label>
                    <input type="text" id="documento" name="documento">

                    <label for="correo">Correo electrónico:</label>
                    <input type="text" id="correo" name="correo">
                </fieldset>
            </div>

            <div id="credito" class="tab-content active">
                <fieldset>
                    <legend>Información General</legend>
                    <label for="fecha">Fecha:</label>
                    <input type="date" id="fecha" name="fecha">
                </fieldset>

                <fieldset>
                    <legend>Detalles del Préstamo</legend>
                    <p>Moneda:</p>
                    <label>
                        <input type="radio" name="moneda" value="Soles">Soles (S/.)
                    </label>
                    <label>
                        <input type="radio" name="moneda" value="Dolares"> Dólares (US%)
                    </label>

                    <br><br>

                    <label for="monto">Monto:</label>
                    <input type="number" id="monto" name="monto">

                    <label for="periodo">Periodo (meses):</label>
                    <input type="number" id="periodo" name="periodo">

                    <label for="cuota">Cuota:</label>
                    <input type="number" step="0.01" id="cuota" name="cuota">
                </fieldset>

                <fieldset>
                    <legend>Tasas y Vencimiento</legend>
                    <label for="tea">Tea (%):</label>
                    <input type="number" step="0.01" id="tea" name="tea">

                    <label for="fecha_vencimiento">Fecha de Vencimiento:</label>
                    <input type="date" id="fecha_vencimiento" name="fecha_vencimiento">
                </fieldset>
            </div>

            <div class="button-group">
                <button type="submit">ACEPTAR</button>
            </div>
        </form>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
